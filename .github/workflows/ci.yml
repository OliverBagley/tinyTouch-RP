name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sensor_tx_pin:
        description: "GP number the sensor's TX wire is connected to (1, 5, 9, 13, or 29)"
        required: false
        default: ""
      sensor_rx_pin:
        description: "GP number the sensor's RX wire is connected to (0, 4, 8, 12, or 28)"
        required: false
        default: ""
      touch_out_pin:
        description: "GP number the sensor's TouchOut wire is connected to (any free pin)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          path: pico-sdk
          persist-credentials: false
      - name: Install the RP2040 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          git -C pico-sdk submodule update --init lib/tinyusb lib/mbedtls
      - name: Create ephemeral firmware signing key
        run: openssl genrsa -out firmware/tiny_touch_unified/secure_boot_signing_key.pem 3072 2>/dev/null
      - name: Build factory firmware
        env:
          # The sensor's TX wire lands on the board's RX pin and vice versa.
          FP_RX_PIN: ${{ inputs.sensor_tx_pin }}
          FP_TX_PIN: ${{ inputs.sensor_rx_pin }}
          FP_INT_PIN: ${{ inputs.touch_out_pin }}
        run: |
          pins=()
          for name in RX TX INT; do
            value="$(eval "printf '%s' \"\${FP_${name}_PIN:-}\"")"
            [[ -z "$value" ]] && continue
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Pin inputs must be plain GP numbers, got: $value" >&2; exit 1; }
            pins+=("-DTINYTOUCH_FP_${name}_PIN=$value")
            case "$name" in
              RX) echo "Sensor TX wire on GP$value (board RX)" ;;
              TX) echo "Sensor RX wire on GP$value (board TX)" ;;
              INT) echo "Sensor TouchOut wire on GP$value" ;;
            esac
          done
          cmake -S firmware/tiny_touch_unified -B firmware/tiny_touch_unified/build -G Ninja \
            -DPICO_SDK_PATH="$PWD/pico-sdk" -DCMAKE_BUILD_TYPE=Release "${pins[@]}"
          cmake --build firmware/tiny_touch_unified/build --parallel
      - name: Assemble and verify firmware artifacts
        run: |
          build=firmware/tiny_touch_unified/build
          openssl dgst -sha256 -verify "$build/signing_public_key.pem" \
            -signature "$build/tiny_touch_unified.sig" "$build/tiny_touch_unified.bin"
          python3 packaging/assemble-release.py \
            --firmware-build "$build" \
            --build-id "${GITHUB_SHA:0:12}"
          python3 packaging/release_integrity.py firmware dist/release --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tinytouch-firmware-rp2040
          path: |
            firmware/tiny_touch_unified/build/tiny_touch_unified.uf2
            firmware/tiny_touch_unified/build/tiny_touch_unified.signed.bin
          if-no-files-found: error

  macos-cli:
    strategy:
      matrix:
        include:
          - architecture: arm64
            expected_arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - name: Test CLI and HID protocol
        run: |
          python -m pip install --require-hashes -r software/macos-helper/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --require-hashes \
            -r software/macos-helper/requirements-release.txt
          python -m unittest discover -s tests -v
          python -m py_compile tinytouch software/macos-helper/tinytouch_helper.py packaging/*.py
          zsh -n packaging/build-standalone-macos.sh firmware/build-and-flash
      - name: Build macOS executable
        env:
          TINYTOUCH_SIGNING_IDENTITY: "-"
        run: packaging/build-standalone-macos.sh
      - name: Verify executable
        run: |
          mkdir dist/verify
          tar -C dist/verify -xzf dist/tinytouch.tar.gz
          cli=dist/verify/tinytouch/tinytouch
          test "$("$cli" --version | tail -n 1)" = "tinyTouch CLI $(tr -d '[:space:]' < VERSION)"
          "$cli" _package_test | grep -q "package ok (${{ matrix.expected_arch }})"
          codesign --verify --strict --verbose=2 "$cli"
          file "$cli" | grep -q "${{ matrix.expected_arch }}"
          python - <<'PY'
          import subprocess, time
          command = ["dist/verify/tinytouch/tinytouch", "--version"]
          started = time.monotonic()
          for _ in range(5): subprocess.run(command, check=True, stdout=subprocess.DEVNULL)
          assert time.monotonic() - started < 5, "CLI startup is unexpectedly slow"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tinytouch-macos-${{ matrix.expected_arch }}
          path: dist/tinytouch.tar.gz

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release sources
        run: |
          test -s VERSION
          python3 -m py_compile tinytouch packaging/*.py

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
